services:
  dev-environment:
    image: ghcr.io/sayayai/dshoer:latest
    container_name: full-dev-env
    restart: unless-stopped
    ports:
      - "52333:2222"
    environment:
      # SSH 免密公钥
      SSH_PUBLIC_KEY: ""
      # Git 提交身份配置 (可选，启动容器时自动配置)
      GIT_USER_NAME: ""
      GIT_USER_EMAIL: ""
    volumes:
      - ./workspace:/root/workspace
      - ./fun/dsh:/root/.dsh
      - ./fun/dev_cache:/cache
    deploy:
      resources:
        limits:
          cpus: "1.6"
          memory: "6G"   
        reservations:
          memory: "2G"
    # 默认启动 SSH 服务 + DSH Web 服务
    command: ["all"]